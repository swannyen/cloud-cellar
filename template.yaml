AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Household stock Telegram bot

Parameters:
  AllowedChatIds:
    Type: String
    Description: Comma-separated Telegram chat IDs the bot responds in

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 60   # a long stocktake keeps the free-text call busy for up to 45 s (src/claude_api.py)
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !Ref StockTable
        PARAM_PREFIX: /bettynuffbot
        ALLOWED_CHAT_IDS: !Ref AllowedChatIds
        CLAUDE_MODEL: claude-haiku-5-5
        FREE_TEXT_AI: "on"   # "off" answers free-text lines with the format hint instead of an AI call
        HOME_CURRENCY: SGD

Resources:
  StockTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain          # the data stays if the stack is deleted
    UpdateReplacePolicy: Retain     # ...or if a change would replace the table
    Properties:
      DeletionProtectionEnabled: true                                       # DynamoDB refuses to delete it, by hand too, until this is off
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}  # restore to any second in the last 35 days, into a new table
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      FunctionUrlConfig:
        AuthType: NONE
      Policies:   # SAM doesn't allow Policies in Globals, so each function lists them
        - DynamoDBCrudPolicy:
            TableName: !Ref StockTable
        - SSMParameterReadPolicy:
            ParameterName: bettynuffbot/*

  # DailyFunction, its schedule and DailyLogs are added in Phase 3 (PLAN.md §7.1).

  WebhookLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WebhookFunction}
      RetentionInDays: 14

Outputs:
  WebhookUrl:
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  WebhookFunctionName:
    Value: !Ref WebhookFunction
